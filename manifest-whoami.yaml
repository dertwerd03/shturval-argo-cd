apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-deployment
  namespace: whoami-test-ns
spec:
  replicas: 6
  selector:
    matchLabels:
      app: whoami-web
  template:
    metadata:
      labels:
        app: whoami-web
    spec:
      containers:
      - name: whoami-app
        image: traefik/whoami:v1.12.0
        ports:
        - containerPort: 80
          hostPort: 0
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-service
  namespace: whoami-test-ns
spec:
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: whoami-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami-ingress
  namespace: whoami-test-ns
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: whoami.shturval-client-01.ip-10-10-2-184.shturval.link
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: whoami-service
            port:
              number: 80
